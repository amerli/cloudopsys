<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CloudOpsys – Apps</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #333; }
        nav { background: #2c3e50; padding: 12px 24px; display: flex; gap: 20px; align-items: center; }
        nav a { color: #ecf0f1; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #3498db; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        h1, h2 { color: #2c3e50; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; }
        th { background: #f0f3f6; font-weight: bold; }
        .btn { display: inline-block; padding: 7px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; text-decoration: none; }
        .btn-primary   { background: #3498db; color: white; }
        .btn-danger    { background: #e74c3c; color: white; }
        .btn-success   { background: #27ae60; color: white; }
        .btn-warning   { background: #f39c12; color: white; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        input[type=text], select { padding: 7px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .msg-ok  { background: #d4edda; color: #155724; padding: 10px 16px; border-radius: 5px; margin-bottom: 16px; }
        .msg-err { background: #f8d7da; color: #721c24; padding: 10px 16px; border-radius: 5px; margin-bottom: 16px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-run  { background: #27ae60; color: white; }
        .badge-stop { background: #95a5a6; color: white; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
<nav>
    <a href="/users">&#128100; Users</a>
    <span style="color:#ecf0f1;">/ Apps: <span th:text="${user.name}"></span></span>
</nav>
<div class="container">
    <div th:if="${message}" class="msg-ok" th:text="${message}"></div>
    <div th:if="${error}"   class="msg-err" th:text="${error}"></div>

    <h1>&#128187; Apps for <span th:text="${user.name}"></span></h1>

    <!-- Associated apps -->
    <div class="card">
        <h2>Associated Applications</h2>
        <table>
            <thead>
                <tr><th>Application</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="ua : ${userApps}">
                    <td th:text="${ua.application.name}"></td>
                    <td>
                        <span th:if="${ua.running}"  class="badge badge-run">RUNNING</span>
                        <span th:if="${!ua.running}" class="badge badge-stop">STOPPED</span>
                    </td>
                    <td style="display:flex;gap:6px;flex-wrap:wrap;">
                        <form th:if="${!ua.running}"
                              th:action="@{/users/{id}/apps/{appId}/start(id=${user.id},appId=${ua.application.id})}"
                              method="post" style="margin:0;">
                            <button type="submit" class="btn btn-success btn-sm">Start</button>
                        </form>
                        <form th:if="${ua.running}"
                              th:action="@{/users/{id}/apps/{appId}/stop(id=${user.id},appId=${ua.application.id})}"
                              method="post" style="margin:0;">
                            <button type="submit" class="btn btn-warning btn-sm">Stop</button>
                        </form>
                        <form th:action="@{/users/{id}/apps/{appId}/remove(id=${user.id},appId=${ua.application.id})}"
                              method="post" style="margin:0;">
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(userApps)}">
                    <td colspan="3" style="color:#aaa;text-align:center;">No applications associated.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Add app -->
    <div class="card">
        <h2>Add Application</h2>
        <form th:action="@{/users/{id}/apps/add(id=${user.id})}" method="post" class="row">
            <input type="text" name="appName" placeholder="e.g. Excel" required/>
            <button type="submit" class="btn btn-primary">Associate</button>
        </form>
        <div th:if="${!#lists.isEmpty(allApps)}" style="margin-top:14px;">
            <strong>All known apps:</strong>
            <span th:each="app,iter : ${allApps}">
                <span th:text="${app.name}"></span><span th:if="${!iter.last}">, </span>
            </span>
        </div>
    </div>

    <a th:href="@{/users/{id}/profile(id=${user.id})}" class="btn btn-secondary">&#128100; Profile</a>
    <a href="/users" class="btn btn-secondary" style="margin-left:8px;">&#8592; Back to Users</a>
</div>
</body>
</html>
